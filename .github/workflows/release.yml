name: Build and release plugin

on:
  push:
    tags:
      - "[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: write
  attestations: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build release assets
        run: npm run build

      - name: Verify release version
        run: node -e "const fs = require('fs'); const manifest = JSON.parse(fs.readFileSync('manifest.json')); if (manifest.version !== process.env.GITHUB_REF_NAME) throw new Error('manifest version must match the release tag');"

      - name: Generate artifact attestations
        uses: actions/attest@v4
        with:
          subject-path: |
            main.js
            manifest.json
            styles.css

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          body: |
            ## Folder Column Navigator ${{ github.ref_name }}

            This release is built from the tagged source by GitHub Actions. The attached `main.js`, `manifest.json`, and `styles.css` are the exact build outputs and have build provenance attestations.
          files: |
            main.js
            manifest.json
            styles.css
